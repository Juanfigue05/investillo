openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification para Sistema de Gestion
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inventario
    description: Gestion de inventario
  - name: ventas
    description: Ventas diarias
  - name: creditos
    description: Creditos de clientes
  - name: compras
    description: Modulo de compras
  - name: manoobra
    description: Mano de obra de trabajadores
  - name: notas
    description: Block de notas
  - name: trabajadores
    description: Trabajadores

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /inventario:
    get:
      operationId: getInventario
      tags: [inventario]
      summary: Lista de productos en inventario
      responses:
        "200":
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Producto"
    post:
      operationId: crearProducto
      tags: [inventario]
      summary: Crear nuevo producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoInput"
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"

  /inventario/{id}:
    get:
      operationId: getProducto
      tags: [inventario]
      summary: Obtener producto por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Producto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
    put:
      operationId: actualizarProducto
      tags: [inventario]
      summary: Actualizar producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoInput"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
    delete:
      operationId: eliminarProducto
      tags: [inventario]
      summary: Eliminar producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeRespuesta"

  /inventario/{id}/stock:
    put:
      operationId: actualizarStock
      tags: [inventario]
      summary: Actualizar stock de producto (al llegar compra)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockUpdate"
      responses:
        "200":
          description: Stock actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"

  /inventario/alertas:
    get:
      operationId: getAlertasStock
      tags: [inventario]
      summary: Productos con stock bajo (stock <= stockMinimo + 1)
      responses:
        "200":
          description: Lista de productos con alerta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Producto"

  /ventas:
    get:
      operationId: getVentas
      tags: [ventas]
      summary: Obtener ventas (por fecha o todas)
      parameters:
        - name: fecha
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Lista de ventas del dia
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VentaDiaria"
    post:
      operationId: crearVenta
      tags: [ventas]
      summary: Registrar una venta diaria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VentaDiariaInput"
      responses:
        "201":
          description: Venta registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VentaDiaria"

  /ventas/resumen:
    get:
      operationId: getVentasResumen
      tags: [ventas]
      summary: Resumen de ventas por dia en un rango de fechas
      parameters:
        - name: desde
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Resumen diario de ventas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VentaResumenDia"

  /ventas/{id}:
    put:
      operationId: actualizarVenta
      tags: [ventas]
      summary: Actualizar una venta
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VentaDiariaInput"
      responses:
        "200":
          description: Venta actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VentaDiaria"
    delete:
      operationId: eliminarVenta
      tags: [ventas]
      summary: Eliminar una venta
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeRespuesta"

  /creditos:
    get:
      operationId: getCreditos
      tags: [creditos]
      summary: Obtener todos los creditos
      parameters:
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [credito, nosdebe]
      responses:
        "200":
          description: Lista de creditos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credito"
    post:
      operationId: crearCredito
      tags: [creditos]
      summary: Crear credito de cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditoInput"
      responses:
        "201":
          description: Credito creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credito"

  /creditos/{id}/abono:
    post:
      operationId: abonarCredito
      tags: [creditos]
      summary: Registrar un abono sobre productos seleccionados del credito
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditoAbonoInput"
      responses:
        "200":
          description: Credito abonado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credito"

  /creditos/{id}/abono/{abonoId}:
    delete:
      operationId: eliminarAbonoCredito
      tags: [creditos]
      summary: Eliminar un abono y revertir sus efectos en Ventas Diarias
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: abonoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Abono eliminado y efectos revertidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credito"
    put:
      operationId: editarAbonoCredito
      tags: [creditos]
      summary: Editar un abono (revierte el anterior y aplica el nuevo)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: abonoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditoAbonoInput"
      responses:
        "200":
          description: Abono actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credito"

  /creditos/{id}:
    put:
      operationId: actualizarCredito
      tags: [creditos]
      summary: Actualizar credito (abonar)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditoUpdate"
      responses:
        "200":
          description: Credito actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credito"
    delete:
      operationId: eliminarCredito
      tags: [creditos]
      summary: Eliminar credito
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeRespuesta"

  /compras:
    get:
      operationId: getCompras
      tags: [compras]
      summary: Obtener lista de compras pendientes
      responses:
        "200":
          description: Lista de compras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Compra"
    post:
      operationId: crearCompra
      tags: [compras]
      summary: Crear orden de compra
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompraInput"
      responses:
        "201":
          description: Compra creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compra"

  /compras/{id}:
    put:
      operationId: actualizarCompra
      tags: [compras]
      summary: Marcar compra como llegada y actualizar inventario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompraUpdate"
      responses:
        "200":
          description: Compra actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compra"
    delete:
      operationId: eliminarCompra
      tags: [compras]
      summary: Eliminar compra
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeRespuesta"

  /manoobra:
    get:
      operationId: getManoObra
      tags: [manoobra]
      summary: Obtener registros de mano de obra
      parameters:
        - name: fecha
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Lista de mano de obra
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManoObra"
    post:
      operationId: crearManoObra
      tags: [manoobra]
      summary: Registrar mano de obra
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManoObraInput"
      responses:
        "201":
          description: Mano de obra registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManoObra"

  /manoobra/{id}:
    put:
      operationId: actualizarManoObra
      tags: [manoobra]
      summary: Actualizar mano de obra
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManoObraInput"
      responses:
        "200":
          description: Mano de obra actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManoObra"
    delete:
      operationId: eliminarManoObra
      tags: [manoobra]
      summary: Eliminar mano de obra
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeRespuesta"

  /trabajadores:
    get:
      operationId: getTrabajadores
      tags: [trabajadores]
      summary: Obtener lista de trabajadores
      responses:
        "200":
          description: Lista de trabajadores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trabajador"
    post:
      operationId: crearTrabajador
      tags: [trabajadores]
      summary: Crear trabajador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrabajadorInput"
      responses:
        "201":
          description: Trabajador creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trabajador"

  /trabajadores/{id}:
    put:
      operationId: actualizarTrabajador
      tags: [trabajadores]
      summary: Actualizar trabajador
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrabajadorInput"
      responses:
        "200":
          description: Trabajador actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trabajador"

  /notas:
    get:
      operationId: getNotas
      tags: [notas]
      summary: Obtener el contenido del block de notas
      responses:
        "200":
          description: Contenido de notas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notas"
    put:
      operationId: guardarNotas
      tags: [notas]
      summary: Guardar contenido del block de notas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotasInput"
      responses:
        "200":
          description: Notas guardadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notas"

  /historial-precios:
    get:
      operationId: getHistorialPrecios
      tags: [historialPrecios]
      summary: Obtener historial de precios de productos
      parameters:
        - name: productoId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Lista de registros de precios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistorialPrecio"

  /historial:
    get:
      operationId: getHistorial
      tags: [historial]
      summary: Listar días guardados en el historial
      responses:
        "200":
          description: Lista de días guardados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistorialDia"
    post:
      operationId: guardarDiaHistorial
      tags: [historial]
      summary: Guardar el día actual en el historial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistorialDiaInput"
      responses:
        "201":
          description: Día guardado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistorialDia"

  /historial/{id}:
    put:
      operationId: actualizarHistorial
      tags: [historial]
      summary: Editar notas de un día del historial (la fecha no cambia)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistorialDiaUpdate"
      responses:
        "200":
          description: Día actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistorialDia"
    delete:
      operationId: eliminarHistorial
      tags: [historial]
      summary: Eliminar un día del historial (no borra las ventas)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeRespuesta"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [inventario]
      summary: Resumen del dashboard
      responses:
        "200":
          description: Datos del dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /clientes:
    get:
      operationId: getClientes
      tags: [clientes]
      summary: Lista de clientes
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Búsqueda por nombre, teléfono o correo
      responses:
        "200":
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cliente"
    post:
      operationId: crearCliente
      tags: [clientes]
      summary: Crear un cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteInput"
      responses:
        "201":
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"

  /clientes/{id}:
    get:
      operationId: getCliente
      tags: [clientes]
      summary: Obtener cliente por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
    put:
      operationId: actualizarCliente
      tags: [clientes]
      summary: Actualizar cliente
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteUpdateInput"
      responses:
        "200":
          description: Cliente actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
    delete:
      operationId: eliminarCliente
      tags: [clientes]
      summary: Eliminar cliente
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cliente eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeRespuesta"

  /clientes/{id}/vehiculos:
    post:
      operationId: agregarVehiculo
      tags: [clientes]
      summary: Agregar vehículo a un cliente
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehiculoInput"
      responses:
        "201":
          description: Vehículo agregado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehiculo"

  /clientes/{id}/vehiculos/{vid}:
    put:
      operationId: actualizarVehiculo
      tags: [clientes]
      summary: Actualizar vehículo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: vid
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehiculoInput"
      responses:
        "200":
          description: Vehículo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehiculo"
    delete:
      operationId: eliminarVehiculo
      tags: [clientes]
      summary: Eliminar vehículo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: vid
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehículo eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeRespuesta"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MensajeRespuesta:
      type: object
      properties:
        mensaje:
          type: string
      required:
        - mensaje

    Producto:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        codigo:
          type: string
        marca:
          type: string
        tipo:
          type: string
          nullable: true
          description: Tipo de producto
        referencia:
          type: string
        adicional:
          type: string
          nullable: true
          description: Información adicional del producto
        precioCompra:
          type: number
          description: Precio de compra en COP
        precioVentaSinIva:
          type: number
          description: Precio de venta sin IVA en COP
        precioVentaConIva:
          type: number
          description: Precio de venta con IVA (redondeado a miles) en COP
        tieneIva:
          type: boolean
          description: Si el producto lleva IVA
        stockActual:
          type: number
        stockMinimo:
          type: number
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
        cantidadRecibida:
          type: number
          nullable: true
        fechaLlegada:
          type: string
          nullable: true
        proveedor:
          type: string
          nullable: true
        precioCompraRegistrado:
          type: number
          nullable: true
        precioVentaRegistrado:
          type: number
          nullable: true
      required:
        - id
        - nombre
        - codigo
        - precioCompra
        - precioVentaSinIva
        - precioVentaConIva
        - tieneIva
        - stockActual
        - stockMinimo

    ProductoInput:
      type: object
      properties:
        nombre:
          type: string
        codigo:
          type: string
        marca:
          type: string
        tipo:
          type: string
        referencia:
          type: string
        adicional:
          type: string
        precioCompra:
          type: number
        precioVentaSinIva:
          type: number
        tieneIva:
          type: boolean
        stockActual:
          type: number
        stockMinimo:
          type: number
      required:
        - nombre
        - codigo
        - precioCompra
        - precioVentaSinIva
        - tieneIva
        - stockActual
        - stockMinimo

    StockUpdate:
      type: object
      properties:
        cantidad:
          type: number
