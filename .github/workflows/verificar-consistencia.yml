name: Verificar Consistencia

on:
  schedule:
    - cron: "0 13 * * *" # todos los días a las 8:00 a.m. hora Colombia (13:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SYNC_ENTORNO: servidor
      SYNC_FECHA_CORTE: ${{ vars.SYNC_FECHA_CORTE || '2026-11-01' }}
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Validar configuración de base de datos
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configura el secreto DATABASE_URL en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Correr la revisión de consistencia
        run: pnpm --filter @workspace/scripts run verificar
