name: Backup Automático

on:
  schedule:
    - cron: "0 14 * * *"   # 9:00 a.m. hora Colombia
    - cron: "0 1 * * *"    # 8:00 p.m. hora Colombia (del día anterior en UTC)
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente de PostgreSQL 18
        run: |
          # 1. Crear el directorio seguro para los keyrings
          sudo mkdir -p /usr/share/keyrings

          # 2. Descargar la llave GPG y desarmarla al nuevo formato oficial
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor | sudo tee /usr/share/keyrings/postgresql-archive-keyring.gpg > /dev/null

          # 3. Registrar el repositorio vinculando explícitamente su llave firmada
          echo "deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list

          # 4. Actualizar índices e instalar el cliente v18
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Verificar herramientas de PostgreSQL
        run: |
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          command -v pg_dump
          pg_dump --version
          pg_restore --version

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable && corepack prepare pnpm@latest --activate
      - run: pnpm install --frozen-lockfile

      - name: Ejecutar respaldo
        run: pnpm --filter @workspace/scripts run backup:ci
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PG_BIN_PATH: /usr/lib/postgresql/18/bin
