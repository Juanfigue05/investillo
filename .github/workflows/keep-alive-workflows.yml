name: Keep Alive workflows

on:
  schedule:
    - cron: '17 3 1 * *'   # día 1 de cada mes, 03:17 UTC
  workflow_dispatch:        # para probarlo a mano

permissions:
  actions: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Reactivar los workflows del repositorio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fallos=0
          ids=$(gh api "/repos/$REPO/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state=="active" or .state=="disabled_inactivity") | .id')
          for id in $ids; do
            if gh api --method PUT "/repos/$REPO/actions/workflows/$id/enable"; then
              echo "Workflow $id reactivado"
            else
              echo "No se pudo reactivar el workflow $id"
              fallos=$((fallos+1))
            fi
          done
          echo "Fallos: $fallos"
          test "$fallos" -eq 0
